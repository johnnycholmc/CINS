        }

        }
        p.subtitle {

        }

            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 600;
        }
        select, input {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #38bdf8;
        }
        .doc-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .doc-title {
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 600;
        }
        .btn-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .btn-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background-color 0.2s ease;
            border: none;
            cursor: pointer;
        }
        .btn-link:hover {
            background-color: #0369a1;
        }
        .btn-link.website {
            background-color: #0d9488;
        }
        .btn-link.website:hover {
            background-color: #0f766e;
        }
        .btn-link svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        .legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.8rem;
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .color-box {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        #info-panel {
            margin-top: auto;
            padding: 14px;
            background-color: #0f172a;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: 0.85rem;
            line-height: 1.5;
            min-height: 130px;

            color: #4ade80;
            margin-bottom: 6px;
            font-size: 0.95rem;

            width: 100%;

                { name: 'cedscha.pdf', label: 'cedscha' }
            ]
        };

        // Program Categories Mapping Definitions
        const PROGRAM_CATEGORIES = {
            ALL: {
                title: 'Department Curriculum Tracks',
                groups: {
                    PREREQ: { name: 'Prerequisites & Foundations', color: COLORS.blue },
                    INST_CORE: { name: 'Instructional Design Core', color: COLORS.green },
                    RESEARCH: { name: 'Research & Evaluation (IDE)', color: COLORS.yellow },
                    EDM_DIV: { name: 'Educational Media / Library Media', color: COLORS.purple },
                    COUNSELING: { name: 'Counseling Major Core', color: COLORS.pink },
                    FIELD: { name: 'Internship, Electives & Dissertation', color: COLORS.red }
                }
            },
            CCP_PHD: {
                title: 'Clinical & Counseling Psychology Ph.D.',
                groups: {
                    CLINICAL_CORE: { name: 'Clinical Core', color: COLORS.pink },
                    RESEARCH: { name: 'Research & Evaluation', color: COLORS.yellow },
                    PRACTICUM: { name: 'Practicum & Field Training', color: COLORS.red }
                }
            },
            CMHC: {
                title: 'Clinical Mental Health Counseling Groups',
                groups: {
                    MAJOR_CORE: { name: 'Major Professional Core', color: COLORS.pink },
                    REL_PROF: { name: 'Related Professional Courses', color: COLORS.yellow },
                    ADV_ELEC: { name: 'Advisor Approved Electives', color: COLORS.teal }
                }
            },
            EDM_MS: {
                title: 'Educational Media M.S. Course Groups',
                groups: {
                    EDM_CORE: { name: 'Educational Media Core (18 Hrs)', color: COLORS.orange },
                    ISD_CORE: { name: 'Instructional Design (3 Hrs)', color: COLORS.green },
                    ED_PSYCH: { name: 'Educational Psychology (3 Hrs)', color: COLORS.blue },
                    ELECTIVE: { name: 'Advisor Approved Electives (6 Hrs)', color: COLORS.teal }
                }
            },
            HPI_CERT: {
                title: 'HPI Certificate Course Groups',
                groups: {
                    CORE_COURSE: { name: 'Core Courses', color: COLORS.teal },
                    SUPP_CW: { name: 'Supporting Coursework', color: COLORS.blue },
                    CAPSTONE: { name: 'Culminating Capstone Experience', color: COLORS.red }
                }
            },
            IDD_CERT: {
                title: 'IDD Certificate Course Groups',
                groups: {
                    CORE_COURSE: { name: 'Core Courses', color: COLORS.green }
                }
            },
            IDD_MS: {
                title: 'IDD M.S. Curriculum Groups',
                groups: {
                    CORE_COURSE: { name: 'Core Courses', color: COLORS.green },
                    ADD_REQ: { name: 'Additional Requirements', color: COLORS.yellow },
                    FIELD_COURSE: { name: 'Field Courses', color: COLORS.red }
                }
            },
            IDD_PHD: {
                title: 'IDD Ph.D. Curriculum Groups',
                groups: {
                    INST_CORE: { name: 'Instructional Core', color: COLORS.green },
                    RESEARCH: { name: 'Research', color: COLORS.yellow },
                    SUPP_CW: { name: 'Supporting Coursework', color: COLORS.blue },
                    DISSERTATION: { name: 'Dissertation', color: COLORS.red }
                }
            },
            LIB_MED: {
                title: 'Library Media P-12 Course Groups',
                groups: {
                    DIV_SUPP: { name: 'Diversity and Support Courses', color: COLORS.blue },
                    EDM_CORE: { name: 'Educational Media Core', color: COLORS.orange },
                    RES_EVAL: { name: 'Research and Evaluation', color: COLORS.green },
                    ELECTIVE: { name: 'Advisor Approved Elective (500-599)', color: COLORS.teal },
                    INTERN: { name: 'Library Media Internships (A/B/C)', color: COLORS.red }
                }
            },
            SCHOOL_COUNSEL: {
                title: 'School Counseling M.Ed. Groups',
                groups: {
                    INST_SUPP: { name: 'Instructional Support', color: COLORS.pink },
                    ED_FOUND: { name: 'Educational Foundations', color: COLORS.blue },
                    RES_EVAL: { name: 'Research and Evaluation', color: COLORS.yellow },
                    ALSDE_PRE: { name: 'ALSDE Prerequisite', color: COLORS.orange }
                }
            }
        };

        // Explicit Connections & Prerequisites
        const rawEdges = [
            { from: 'EDM 510', to: 'EDM 584', label: 'Recommended' },
            { from: 'EDM 520', to: 'ISD 581', label: 'Recommended' },
            { from: 'EPY 502', to: 'EPY 602', label: 'Prereq' },
            { from: 'ISD 621', to: 'ISD 622', label: 'Prereq' },
            { from: 'ISD 622', to: 'ISD 623', label: 'Prereq' },
            { from: 'IDE 510', to: 'IDE 620', label: 'Sequence' },
            { from: 'IDE 620', to: 'IDE 621', label: 'Sequence' },
            { from: 'ISD 621', to: 'ISD 640', label: 'Foundation' },
            { from: 'ISD 640', to: 'IDE 645', label: 'Prereq' },
            { from: 'ISD 641', to: 'IDE 645', label: 'Prereq' },
            { from: 'ISD 621', to: 'ISD 611', label: 'Capstone Prep' },
            { from: 'IDE 660', to: 'ISD 611', label: 'Capstone Prep' },
            { from: 'CED 572', to: 'CED 576', label: 'Prereq' },
            { from: 'CED 586', to: 'CED 576', label: 'Prereq' },
            { from: 'CED 576', to: 'CED 595', label: 'Prereq' },
            { from: 'CED 576', to: 'CED 597', label: 'Prereq' },
            { from: 'IDE 630', to: 'ISD 799', label: 'Exam Req' },
            { from: 'ISD 695', to: 'ISD 799', label: 'Dissertation Prep' }
        ];

        // Global Vis.js DataSets
        const nodesDataSet = new vis.DataSet([]);
        const edgesDataSet = new vis.DataSet([]);

        const container = document.getElementById('mynetwork');
        const data = { nodes: nodesDataSet, edges: edgesDataSet };

        const options = {
            nodes: {
                shape: 'circle',
                size: 28,
                font: { size: 11, color: '#ffffff', face: 'Segoe UI', multi: 'html' },
                borderWidth: 2,
                shadow: true
            },
            edges: {
                width: 2,
                color: { color: '#475569', highlight: '#38bdf8' },
                font: { size: 9, color: '#94a3b8', strokeWidth: 0 },
                smooth: { type: 'cubicBezier', roundness: 0.2 }
            },
            physics: {
                forceAtlas2Based: {
                    gravitationalConstant: -45,
                    centralGravity: 0.008,
                    springLength: 130,
                    springConstant: 0.12
                },
                maxVelocity: 120,
                solver: 'forceAtlas2Based',
                timestep: 0.35,
                stabilization: { iterations: 150 }
            },
            interaction: { hover: true, tooltipDelay: 150 }
        };

        const network = new vis.Network(container, data, options);

        // Custom Canvas Text Renderer
        network.on("afterDrawing", function (ctx) {
            const nodeIds = nodesDataSet.getIds();
            ctx.font = "11px 'Segoe UI', sans-serif";
            ctx.fillStyle = "#cbd5e1";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";

            nodeIds.forEach(id => {
                const node = nodesDataSet.get(id);
                const pos = network.getPositions([id])[id];
                if (pos && node) {
                    let title = node.fullName;
                    if (title.length > 26) title = title.substring(0, 24) + '...';
                    ctx.fillText(title, pos.x, pos.y + 32);
                }
            });
        });

        // Dynamic Filtering & Double Button Setup
        function filterMap() {
            const prog = document.getElementById('program-filter').value;
            const progConfig = PROGRAM_CATEGORIES[prog] || PROGRAM_CATEGORIES.ALL;

            // Update Resource Buttons Section
            const docContainer = document.getElementById('doc-buttons');
            const docTitle = document.getElementById('doc-title');
            docContainer.innerHTML = '';
            
            docTitle.innerText = prog === 'ALL' ? 'All Course Resources' : 'Program Resources';

            const webIcon = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`;
            const downloadIcon = `<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>`;

            // 1. Web Link Button
            if (PROGRAM_URLS[prog]) {
                const webBtn = document.createElement('a');
                webBtn.className = 'btn-link website';
                webBtn.href = PROGRAM_URLS[prog];
                webBtn.target = '_blank';
                webBtn.title = 'Visit Official Program Website';
                webBtn.innerHTML = `${webIcon} Official Website`;
                docContainer.appendChild(webBtn);
            }

            // 2. Direct GitHub Download Button(s)
            const docs = PROGRAM_DOCS[prog] || [];
            docs.forEach(doc => {
                const downloadUrl = GITHUB_BASE_URL + doc.name;
                
                const docBtn = document.createElement('a');
                docBtn.className = 'btn-link';
                docBtn.href = downloadUrl;
                docBtn.download = doc.name;
                docBtn.title = `Download ${doc.name} directly`;
                docBtn.innerHTML = `${downloadIcon} Doc: ${doc.label}`;
                docContainer.appendChild(docBtn);
            });

            // Update Sidebar Legend
            document.getElementById('legend-title').innerText = progConfig.title;
            const legendContainer = document.getElementById('legend-items');
            legendContainer.innerHTML = '';

            const visGroups = {};
            Object.keys(progConfig.groups).forEach(gKey => {
                const groupInfo = progConfig.groups[gKey];
                visGroups[gKey] = { color: groupInfo.color };

                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<div class="color-box" style="background:${groupInfo.color.background}; border: 1px solid ${groupInfo.color.border}"></div> ${groupInfo.name}`;
                legendContainer.appendChild(item);
            });

            network.setOptions({ groups: visGroups });

            const filteredRaw = prog === 'ALL' ? rawNodes : rawNodes.filter(n => n.programs.includes(prog));
            
            const formatted = filteredRaw.map(n => {
                const activeCategory = n.cat[prog] || n.cat.ALL;
                return {
                    id: n.id,
                    label: `<b>${n.code}</b>\n(${n.credits})`,
                    title: n.name,
                    group: activeCategory,
                    fullName: n.name,
                    credits: n.credits,
                    programs: n.programs,
                    currentCatKey: activeCategory
                };
            });

            const filteredNodeIds = new Set(formatted.map(n => n.id));
            const filteredEdges = rawEdges.filter(e => filteredNodeIds.has(e.from) && filteredNodeIds.has(e.to)).map(e => ({ ...e, arrows: 'to' }));

            nodesDataSet.clear();
            edgesDataSet.clear();
            nodesDataSet.add(formatted);
            edgesDataSet.add(filteredEdges);
        }

        // Search Node Logic
        function searchNode() {
            const query = document.getElementById('search-input').value.toLowerCase();
            if (!query) return;

            const found = nodesDataSet.get().find(n => n.id.toLowerCase().includes(query) || n.fullName.toLowerCase().includes(query));
            if (found) {
                network.focus(found.id, { scale: 1.2, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
                network.selectNodes([found.id]);
                showInfo(found.id);
            }
        }

        // Info Panel Display Logic
        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                showInfo(params.nodes[0]);
            }
        });

        function showInfo(nodeId) {
            const node = nodesDataSet.get(nodeId);
            if (!node) return;

            const currentProg = document.getElementById('program-filter').value;
            const progConfig = PROGRAM_CATEGORIES[currentProg] || PROGRAM_CATEGORIES.ALL;
            const categoryObj = progConfig.groups[node.currentCatKey] || { name: 'General Major Course' };

            const infoPanel = document.getElementById('info-content');
            infoPanel.innerHTML = `
                <strong>Course Code:</strong> ${node.id}<br>
                <strong>Full Title:</strong> ${node.fullName}<br>
                <strong>Credit Hours:</strong> ${node.credits}<br>
                <strong>Category (${currentProg}):</strong> ${categoryObj.name}<br>
                <strong>Associated Programs:</strong><br>• ${node.programs.join('<br>• ')}
            `;
        }

        // Initialize on Load
        filterMap();
    </script>
</body>
